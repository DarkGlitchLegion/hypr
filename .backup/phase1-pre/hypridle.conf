# -----------------------------------------------------
# Hypridle Configuration — Minimalist Power & Lock Management
# -----------------------------------------------------

general {
    lock_cmd = pidof hyprlock || hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# Dim screen slightly before lock (4.5 min)
listener {
    timeout = 270
    on-timeout = brightnessctl -s set 20%
    on-resume = brightnessctl -r
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off display after 6 minutes
listener {
    timeout = 360
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend PC after 30 minutes
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
