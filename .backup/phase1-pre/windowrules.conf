# -----------------------------------------------------
# Window Rules Configuration
# -----------------------------------------------------

# Ignore maximize requests from apps
windowrulev2 = suppressmaximize, class:.*

# Floating rules for dialogs and utility windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(hypr-keybindings)$
windowrulev2 = size 860 620, class:^(hypr-keybindings)$
windowrulev2 = center, class:^(hypr-keybindings)$
windowrulev2 = float, class:^(thunar)$, title:^(File Operation Progress)$
windowrulev2 = float, class:^(thunar)$, title:^(Confirm to replace files)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$
windowrulev2 = float, title:^(Choose Files)$
windowrulev2 = float, title:^(branchdialog)$

# Window sizing & positioning for dialogs
windowrulev2 = size 700 500, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$

# Prevent idle sleep when video or media is playing fullscreen
windowrulev2 = idleinhibit fullscreen, class:.*

# Subtle application opacity adjustments
windowrulev2 = opacity 0.96 0.90, class:^(kitty)$
windowrulev2 = opacity 0.98 0.92, class:^(thunar)$
windowrulev2 = opacity 0.82 0.75, class:^(btop)$
windowrulev2 = opacity 0.82 0.75, title:^(btop)$
windowrulev2 = opacity 0.75 0.70, class:^(cmatrix)$
windowrulev2 = opacity 0.75 0.70, title:^(cmatrix)$

# Layer rules for UI blurring
layerrule = blur, waybar
layerrule = ignorezero, waybar
layerrule = blur, rofi
layerrule = ignorezero, rofi
layerrule = blur, notifications
layerrule = ignorezero, notifications
