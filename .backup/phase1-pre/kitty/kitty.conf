# =====================================================
# Kitty Terminal Configuration — Minimal Dark Theme
# Font: JetBrainsMono Nerd Font
# =====================================================

# Font configuration
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        10.0

# Compact layout, padding & line spacing
adjust_line_height  0
adjust_column_width 0
window_padding_width 8 10
placement_strategy center
confirm_os_window_close 0
mouse_hide_wait 3.0

# Transparency & background
background_opacity 0.92
dynamic_background_opacity yes

# Cursor customization
cursor            #AAAAAA
cursor_text_color #0C0D10
cursor_shape      block
cursor_blink_interval 0

# Colors (Minimal Charcoal & Subtle Accents)
background        #0C0D10
foreground        #D5D5D5
selection_background #333333
selection_foreground #D5D5D5
url_color         #AAAAAA

# ANSI 16 Colors (Muted Developer Palette)
# Black
color0  #17191F
color8  #333333

# Red
color1  #BF616A
color9  #D08770

# Green
color2  #A3BE8C
color10 #A3BE8C

# Yellow
color3  #EBCB8B
color11 #EBCB8B

# Blue
color4  #81A1C1
color12 #88C0D0

# Magenta
color5  #B48EAD
color13 #B48EAD

# Cyan
color6  #8FBCBB
color14 #88C0D0

# White
color7  #D5D5D5
color15 #FFFFFF
