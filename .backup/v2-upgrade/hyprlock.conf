# -----------------------------------------------------
# Hyprlock Configuration — Minimalist Dark Lockscreen
# -----------------------------------------------------

background {
    monitor =
    path = /home/darkglitch/.config/hypr/wallpapers/spiderman.png
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(aaaaaaff)
    inner_color = rgba(23, 25, 31, 0.95)
    font_color = rgb(213, 213, 213)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Enter password...</span>
    hide_input = false
    check_color = rgb(170, 170, 170)
    fail_color = rgb(191, 97, 106)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -30
    halign = center
    valign = center
}

# Clock (Time)
label {
    monitor =
    text = $TIME
    color = rgb(213, 213, 213)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 90
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgb(136, 136, 136)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
}
