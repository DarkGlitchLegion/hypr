# =====================================================================
# NOTICE: HYPRLAND 0.57.2+ LUA ENGINE MIGRATION
# Active animations are now dynamically configured in:
#   ~/.config/hypr/lua/animations.lua
# This file is retained for reference and fallback compatibility.
# =====================================================================

animations {
    enabled = true

    # Bezier curves (smooth quintic ease-out & snappy easing)
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1.0

    # Window animations
    animation = windows, 1, 3.5, easeOutQuint, popin 80%
    animation = windowsIn, 1, 3.5, easeOutQuint, popin 80%
    animation = windowsOut, 1, 3, easeInOutCubic, popin 80%
    animation = windowsMove, 1, 3.5, easeOutQuint

    # Fade animations
    animation = fadeIn, 1, 2.5, almostLinear
    animation = fadeOut, 1, 2.5, almostLinear
    animation = fade, 1, 3, default

    # Border transitions
    animation = border, 1, 4, default
    animation = borderangle, 1, 8, default

    # Workspace slide animations
    animation = workspaces, 1, 3.5, easeOutQuint, slide
}
