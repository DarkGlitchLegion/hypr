# =====================================================================
# NOTICE: HYPRLAND 0.57.2+ LUA ENGINE MIGRATION
# Active keybindings are now dynamically configured in:
#   ~/.config/hypr/lua/keybinds.lua
# This file is retained for reference and fallback compatibility.
# =====================================================================

$mainMod = SUPER
$scripts = ~/.config/hypr/scripts
$kittyConf = ~/.config/hypr/kitty/kitty.conf
$rofiConf = ~/.config/hypr/rofi/config.rasi
$launcherConf = ~/.config/hypr/rofi/launcher.rasi
$lockConf = ~/.config/hypr/hyprlock/hyprlock.conf

# ---------------------------------------------------------------------
# 1. APPLICATION LAUNCHING & CONTROL CENTER
# ---------------------------------------------------------------------
# Super + Return: Default Terminal (Kitty)
bind = $mainMod, RETURN, exec, kitty --config $kittyConf

# Super + Shift + Return: Default Web Browser (Firefox)
bind = $mainMod SHIFT, RETURN, exec, firefox

# Super + Space: Primary Application Launcher (Rofi)
bind = $mainMod, SPACE, exec, rofi -show drun -config $launcherConf

# Super + Alt + Space: Hyprland Control Center
bind = $mainMod ALT, SPACE, exec, $scripts/control-center.sh

# Super + C: Hyprland Control Center (Alternative)
bind = $mainMod, C, exec, $scripts/control-center.sh

# Super + Shift + F: File Manager (Thunar)
bind = $mainMod SHIFT, F, exec, thunar

# Super + Shift + E: Text Editor (VS Code / Nano)
bind = $mainMod SHIFT, E, exec, code || kitty --config $kittyConf -e nano

# Super + Shift + T: Activity / Process Monitor (Btop - Transparent)
bind = $mainMod SHIFT, T, exec, kitty --class btop --title btop --config $kittyConf -e btop

# Super + Shift + C: Matrix Terminal Screensaver (CMatrix - Transparent)
bind = $mainMod SHIFT, C, exec, $scripts/cmatrix.sh

# Super + Shift + S: Graphical Wi-Fi Manager (Rofi)
bind = $mainMod SHIFT, S, exec, $scripts/wifi-menu.sh

# Super + Shift + B: Graphical Bluetooth Manager (Rofi)
bind = $mainMod SHIFT, B, exec, $scripts/bluetooth-menu.sh

# ---------------------------------------------------------------------
# 2. WINDOW MANAGEMENT
# ---------------------------------------------------------------------
# Super + W: Close Active Window
bind = $mainMod, W, killactive,
# Super + Q: Close Active Window (Alternative)
bind = $mainMod, Q, killactive,

# Super + T: Toggle Tiling / Floating
bind = $mainMod, T, togglefloating,
# Super + V: Toggle Floating (Alternative)
bind = $mainMod, V, togglefloating,

# Super + F: Toggle Fullscreen
bind = $mainMod, F, fullscreen, 0

# Super + Alt + F: Full Width / Maximize
bind = $mainMod ALT, F, fullscreen, 1

# Super + P: Toggle Pseudo Tiling
bind = $mainMod, P, pseudo,

# Super + J: Toggle Split Direction (Horizontal / Vertical)
bind = $mainMod, J, togglesplit,

# Window Grouping (Tabs)
bind = $mainMod, G, togglegroup,
bind = $mainMod ALT, G, moveoutofgroup,
bind = $mainMod ALT, TAB, changegroupactive, f

# Directional Window Focus (Arrow Keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Directional Window Movement / Swap (Shift + Arrow Keys)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Window Resizing (Keyboard Steps)
binde = $mainMod, equal, resizeactive, 30 30
binde = $mainMod, minus, resizeactive, -30 -30

# Window Movement and Resizing (Mouse)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---------------------------------------------------------------------
# 3. WORKSPACE MANAGEMENT
# ---------------------------------------------------------------------
# Jump to Workspace (1 - 5)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move Active Window to Workspace & Follow (Shift + 1 - 5)
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Move Active Window to Workspace Silently (Shift + Alt + 1 - 5)
bind = $mainMod SHIFT ALT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT ALT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT ALT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT ALT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT ALT, 5, movetoworkspacesilent, 5

# Workspace Navigation
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1
bind = $mainMod CTRL, TAB, workspace, previous
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# ---------------------------------------------------------------------
# 4. SYSTEM CONTROLS & SESSION
# ---------------------------------------------------------------------
# Super + Escape: System / Power Menu
bind = $mainMod, ESCAPE, exec, $scripts/power-menu.sh

# Super + Ctrl + L / Super + L: Lock Screen (Hyprlock)
bind = $mainMod CTRL, L, exec, hyprlock -c $lockConf
bind = $mainMod, L, exec, hyprlock -c $lockConf

# Super + Shift + R: Reload Desktop (Hyprland & Waybar)
bind = $mainMod SHIFT, R, exec, $scripts/restart-waybar.sh && hyprctl reload

# Super + Ctrl + A: Open PipeWire Audio Switcher
bind = $mainMod CTRL, A, exec, $scripts/audio-menu.sh

# Notification Management (Dunst)
bind = $mainMod SHIFT, D, exec, $scripts/notification-toggle.sh
bind = $mainMod CTRL, N, exec, $scripts/notification-history.sh
bind = $mainMod, N, exec, dunstctl history-pop
bind = $mainMod SHIFT, N, exec, dunstctl close-all

# ---------------------------------------------------------------------
# 5. PRODUCTIVITY & CAPTURE
# ---------------------------------------------------------------------
# Super + K: Custom Keybindings Window (Rofi Modal with Fuzzy Search)
bind = $mainMod, K, exec, $scripts/keybindings-menu.sh
# Super + Shift + K: Floating Terminal Keybindings Cheatsheet
bind = $mainMod SHIFT, K, exec, $scripts/keybindings-window.sh

# Super + Ctrl + W / Super + Ctrl + Space: Wallpaper Selector (Rofi Thumbnail Grid)
bind = $mainMod CTRL, W, exec, $scripts/wallpaper-selector.sh
bind = $mainMod CTRL, SPACE, exec, $scripts/wallpaper-selector.sh

# Super + Ctrl + V: Clipboard History (Rofi + Cliphist)
bind = $mainMod CTRL, V, exec, $scripts/clipboard-menu.sh
# Super + Ctrl + Shift + V: Wipe Clipboard History
bind = $mainMod CTRL SHIFT, V, exec, $scripts/clipboard-clear.sh

# Screenshots (Print Screen Key Family)
bind = , Print, exec, $scripts/screenshot.sh region
bind = $mainMod, Print, exec, $scripts/screenshot.sh full
bind = $mainMod CTRL, C, exec, $scripts/screenshot.sh menu

# ---------------------------------------------------------------------
# 6. HARDWARE & MULTIMEDIA CONTROLS
# ---------------------------------------------------------------------
# Volume Up / Down / Mute (Standard 5% steps)
bindel = , XF86AudioRaiseVolume, exec, $scripts/volume.sh up 5
bindel = , XF86AudioLowerVolume, exec, $scripts/volume.sh down 5
bindl  = , XF86AudioMute, exec, $scripts/volume.sh mute
bindl  = , XF86AudioMicMute, exec, $scripts/volume.sh mic

# Fine Volume Adjustments (Alt + Volume Up/Down = 1% steps)
bindel = ALT, XF86AudioRaiseVolume, exec, $scripts/volume.sh up 1
bindel = ALT, XF86AudioLowerVolume, exec, $scripts/volume.sh down 1

# Display Brightness Controls (Standard 5% steps)
bindel = , XF86MonBrightnessUp, exec, $scripts/brightness.sh up 5
bindel = , XF86MonBrightnessDown, exec, $scripts/brightness.sh down 5

# Fine Brightness Adjustments (Alt + Brightness Up/Down = 1% steps)
bindel = ALT, XF86MonBrightnessUp, exec, $scripts/brightness.sh up 1
bindel = ALT, XF86MonBrightnessDown, exec, $scripts/brightness.sh down 1

# Maximum / Minimum Brightness (Shift + Brightness Up/Down)
bindel = SHIFT, XF86MonBrightnessUp, exec, $scripts/brightness.sh max
bindel = SHIFT, XF86MonBrightnessDown, exec, $scripts/brightness.sh min
