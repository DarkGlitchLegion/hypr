# =====================================================================
# Hyprlock Configuration — Minimalist Dark 2D Lock Screen
# Engine: Hyprlock v0.9.7 with Animated Character Input
# Palette: Charcoal #0C0D10 | Surface #17191F | Accent #AAAAAA
# Font: JetBrainsMono Nerd Font
# =====================================================================

# ---------------------------------------------------------------------
# 1. GENERAL SETTINGS
# ---------------------------------------------------------------------
general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
}

# ---------------------------------------------------------------------
# 2. ANIMATIONS
# ---------------------------------------------------------------------
animations {
    enabled = true
    
    # macOS-inspired easing curves (matching desktop motion system)
    bezier = macosOut,     0.16, 1.0, 0.3, 1.0
    bezier = macosClose,   0.55, 0.0, 1.0, 0.85
    bezier = macosSpring,  0.25, 1.0, 0.5, 1.0
    bezier = macosFade,    0.4,  0.0, 0.6, 1.0

    # Screen fade-in: gentle, like macOS login screen appearance
    animation = fadeIn,          1, 3,   macosOut
    # Screen fade-out: quick and confident
    animation = fadeOut,         1, 2.5, macosClose

    # Input field dots: spring pop as each character registers
    animation = inputFieldDots,  1, 2,   macosSpring
    # Input field color feedback: smooth authentication state shift
    animation = inputFieldColors, 1, 2.5, macosFade
}

# ---------------------------------------------------------------------
# 3. BACKGROUND & ATMOSPHERIC BLUR
# ---------------------------------------------------------------------
background {
    monitor =
    path = /home/darkglitch/.config/hypr/wallpapers/wallhaven-l827rq_1920x1080.png
    color = rgba(12, 13, 16, 0.95)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7500
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# ---------------------------------------------------------------------
# 4. DIGITAL CLOCK (TIME)
# ---------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(213, 213, 213)
    font_size = 68
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 90
    halign = center
    valign = center
    shadow_passes = 0
}

# ---------------------------------------------------------------------
# 5. DATE DISPLAY
# ---------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d')"
    color = rgb(136, 136, 136)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 30
    halign = center
    valign = center
    shadow_passes = 0
}

# ---------------------------------------------------------------------
# 6. FLAT 2D PASSWORD INPUT FIELD (WITH CHARACTER STORE ANIMATION)
# ---------------------------------------------------------------------
input-field {
    monitor =
    size = 260, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1

    # Clean flat 2D colors (No gradients or 3D shadows)
    outer_color = rgba(170, 170, 170, 0.9)
    inner_color = rgba(23, 25, 31, 0.95)
    font_color = rgb(213, 213, 213)

    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Enter password...</span>
    hide_input = false

    # Authentication feedback states
    check_color = rgb(170, 170, 170)
    fail_color = rgb(191, 97, 106)
    capslock_color = rgb(235, 203, 139)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 200

    position = 0, -30
    halign = center
    valign = center

    # Pure Flat 2D
    shadow_passes = 0
}

# ---------------------------------------------------------------------
# 7. LOCK STATUS INDICATOR
# ---------------------------------------------------------------------
label {
    monitor =
    text = 󰌾  Session Locked
    color = rgba(170, 170, 170, 0.75)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -90
    halign = center
    valign = center
    shadow_passes = 0
}
