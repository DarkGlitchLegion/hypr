# =====================================================================
# Hyprlock Configuration — Minimalist Dark Lock Screen
# Palette: Charcoal #0C0D10 | Surface #17191F | Accent #AAAAAA
# Font: JetBrainsMono Nerd Font
# =====================================================================

# 1. BACKGROUND & VISUAL OVERLAY
background {
    monitor =
    path = /home/darkglitch/.config/hypr/wallpapers/minimal-dark.png
    color = rgba(12, 13, 16, 1.0)
    blur_passes = 3
    blur_size = 7
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.7500
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# 2. TIME DISPLAY (CLOCK)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(213, 213, 213)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.4)
}

# 3. DATE DISPLAY
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %B %d, %Y')"
    color = rgb(136, 136, 136)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 36
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(0, 0, 0, 0.4)
}

# 4. PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.22
    dots_center = true
    outer_color = rgba(170, 170, 170, 0.9)
    inner_color = rgba(23, 25, 31, 0.92)
    font_color = rgb(213, 213, 213)
    fade_on_empty = false
    placeholder_text = <span foreground="##888888">Enter password...</span>
    hide_input = false
    check_color = rgb(170, 170, 170)
    fail_color = rgb(191, 97, 106)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(235, 203, 139)
    position = 0, -45
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 3
    shadow_color = rgba(0, 0, 0, 0.3)
}

# 5. LOCK STATUS INDICATOR
label {
    monitor =
    text = 󰌾  Session Locked
    color = rgba(170, 170, 170, 0.75)
    font_size = 11
    font_family = JetBrainsMono Nerd Font
    position = 0, -100
    halign = center
    valign = center
}
